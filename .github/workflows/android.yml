
name: Build ZenBubble Music Pill

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract source ZIP
        run: |
          unzip -o "ZenBubble_Music_Pill_Source_v1 (1).zip" -d source

      - name: Build APK
        working-directory: source/ZenBubble_Music_Pill_Source_v1
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenBubble-Music-Pill
          path: source/ZenBubble_Music_Pill_Source_v1/app/build/outputs/apk/debug/app-debug.apk
